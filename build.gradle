buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java-library'
    id 'jvm-test-suite'
    id 'maven-publish'
    id 'jacoco'
    alias(libs.plugins.git.version)
    alias(libs.plugins.spotless)
    alias(libs.plugins.owasp.dependencycheck)
}

group = 'com.maybeitssquid'
version = gitVersion().replaceAll('^v', '')  // Strip 'v' prefix from git tags

repositories {
    mavenCentral()
}

// Dynamic version ranges otherwise resolve to prereleases; slf4j "2.+" picks up 2.1.0-alpha1.
// Match known prerelease qualifiers rather than allowlisting stable ones. Stable releases carry
// odd suffixes — 0.0.20131108.vaadin1 and 2.3.1-b170201.1204 are both stable — and an allowlist
// rejects them, breaking resolution of transitive dependencies.
// shared:begin prerelease-filter
configurations.all {
    resolutionStrategy.componentSelection.all { selection ->
        if (selection.candidate.version ==~ /(?i).*[.\-](alpha|beta|rc|cr|snapshot|preview|dev|milestone|m\d+)[.\-]?\d*$/) {
            selection.reject('prerelease version')
        }
    }
}
// shared:end prerelease-filter

java {
    // shared:begin toolchain
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    // shared:end toolchain
    withSourcesJar()
    withJavadocJar()
}

// shared:begin release-option
tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.release.get().toInteger()
}
// shared:end release-option

dependencies {
    constraints {
        libs.bundles.security.patches.get().each {
            add('implementation', it)
        }
    }
    // The public API exposes these types (HttpServletResponse, Logger, IntervalBiFunction), so consumers
    // need them on their compile classpath.
    api libs.slf4j.api
    api libs.jakarta.servlet.api
    api libs.resilience4j.retry
}

testing {
    suites.test {
        // Every JUnit module's version comes from the JUnit BOM, as the Spring projects take theirs from
        // the Spring Boot BOM. useJUnitJupiter() also declares Gradle's default Jupiter version, which is
        // older, so the BOM's version wins.
        useJUnitJupiter()
        dependencies {
            implementation platform(libs.junit.bom)
            implementation libs.mockito.core
            implementation libs.mockito.junit.jupiter
            runtimeOnly libs.junit.platform.launcher
        }

        // Tests run on the JDK named by -PtestJava (CI passes each matrix version); without it, on the
        // toolchain. Compilation always uses the toolchain, targeting the release version.
        targets.configureEach {
            testTask.configure {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = providers.gradleProperty('testJava')
                            .orElse(libs.versions.java)
                            .map { JavaLanguageVersion.of(it) }
                }
                // Log the test JVM so each CI job shows which Java its tests ran on.
                doFirst { task ->
                    def jvm = task.javaLauncher.get().metadata
                    task.logger.lifecycle("Tests run on Java ${jvm.javaRuntimeVersion} (${jvm.vendor}, ${jvm.installationPath})")
                }
            }
        }
    }
}

// shared:begin jacoco-report
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = false
    }
}
// shared:end jacoco-report

// shared:begin spotless
spotless {
    java {
        targetExclude 'src/*/java/module-info.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
// shared:end spotless

// The NVD key is optional. Without one, the check uses the local NVD cache and warns.
// shared:begin nvd-key
def nvdKey = providers.environmentVariable('NVD_API_KEY')
    .orElse(providers.gradleProperty('nvd.apiKey')).orNull
// shared:end nvd-key

// shared:begin dependency-check
dependencyCheck {
    failBuildOnCVSS = 7
    if (nvdKey) {
        nvd { apiKey = nvdKey }
    } else {
        autoUpdate = false
    }
}
// shared:end dependency-check

// shared:begin nvd-warning
tasks.named('dependencyCheckAnalyze') {
    doFirst {
        if (!nvdKey) {
            logger.warn('NVD_API_KEY is not set: using the local NVD cache without a live update.')
        }
    }
}
// shared:end nvd-warning

// shared:begin javadoc-options
tasks.withType(Javadoc).configureEach {
    options {
        encoding = 'UTF-8'
        links "https://docs.oracle.com/en/java/javase/${libs.versions.java.get()}/docs/api/"
        addBooleanOption('html5', true)
        // Standard JDK documentation tags are not registered for non-JDK code by default
        tags(
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        )
    }
}
// shared:end javadoc-options

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.env.GITHUB_REPOSITORY ?: 'bhanafee/RetryHTTP'}")
            credentials {
                username = System.env.USERNAME ?: System.env.GITHUB_ACTOR
                password = System.env.TOKEN ?: System.env.GITHUB_TOKEN
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'retry-http'
            pom {
                name = 'RetryHTTP'
                description = 'HTTP-aware resilience predicates for Resilience4j'
                url = 'https://github.com/bhanafee/RetryHTTP'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                scm {
                    url = 'https://github.com/bhanafee/RetryHTTP'
                    connection = 'scm:git:git://github.com/bhanafee/RetryHTTP.git'
                    developerConnection = 'scm:git:ssh://github.com/bhanafee/RetryHTTP.git'
                }
            }
        }
    }
}
